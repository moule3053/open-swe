apiVersion: apps/v1
kind: Deployment
metadata:
  name: alephat-ui
  namespace: alephat
  labels:
    app: alephat-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alephat-ui
  template:
    metadata:
      labels:
        app: alephat-ui
    spec:
      containers:
        - name: ui
          image: us-central1-docker.pkg.dev/your-gcp-project-id/alephat/alephat-ui:latest
          imagePullPolicy: Always
          env:
            - name: API_UPSTREAM
              value: alephat-api:80
            - name: NGINX_ENVSUBST_FILTER
              value: API_UPSTREAM
          ports:
            - containerPort: 3000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alephat-ui
  namespace: alephat
spec:
  selector:
    app: alephat-ui
  ports:
    - name: http
      port: 80
      targetPort: http
