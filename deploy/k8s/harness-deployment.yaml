# Harness workers: one active run per pod (concurrency=1).
# Scale with KEDA (see harness-keda.yaml) on JetStream / queue depth.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alephat-harness
  namespace: alephat
  labels:
    app: alephat-harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alephat-harness
  template:
    metadata:
      labels:
        app: alephat-harness
    spec:
      serviceAccountName: alephat-harness
      initContainers:
        - name: migrate
          image: us-central1-docker.pkg.dev/your-gcp-project-id/alephat/alephat-platform:latest
          imagePullPolicy: Always
          command: ["python", "-m", "alephat_platform.migrate"]
          envFrom:
            - configMapRef:
                name: alephat-config
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_URL
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alephat-postgres
                  key: password
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_HOST
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_USER
      containers:
        - name: harness
          image: us-central1-docker.pkg.dev/your-gcp-project-id/alephat/alephat-platform:latest
          imagePullPolicy: Always
          command: ["python", "-m", "alephat_platform.harness.worker"]
          envFrom:
            - configMapRef:
                name: alephat-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alephat-postgres
                  key: password
            - name: SERVICE_NAME
              value: harness
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DAYTONA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alephat-secrets
                  key: DAYTONA_API_KEY
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alephat-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alephat-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: FIREWORKS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alephat-secrets
                  key: FIREWORKS_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alephat-secrets
                  key: GOOGLE_API_KEY
                  optional: true
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: masterkey
                  optional: false
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: alephat-oauth
                  key: TOKEN_ENCRYPTION_KEY
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: alephat-oauth
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: alephat-oauth
                  key: GITHUB_APP_PRIVATE_KEY
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: alephat-oauth
                  key: GITHUB_APP_INSTALLATION_ID
            - name: OPENSANDBOX_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: alephat-secrets
                  key: OPENSANDBOX_BASE_URL
                  optional: true
            - name: OPENSANDBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alephat-secrets
                  key: OPENSANDBOX_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
