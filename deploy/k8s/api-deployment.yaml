apiVersion: apps/v1
kind: Deployment
metadata:
  name: alephat-api
  namespace: alephat
  labels:
    app: alephat-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alephat-api
  template:
    metadata:
      labels:
        app: alephat-api
    spec:
      initContainers:
        - name: migrate
          image: us-central1-docker.pkg.dev/your-gcp-project-id/alephat/alephat-platform:latest
          imagePullPolicy: Always
          command: ["python", "-m", "alephat_platform.migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_URL
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alephat-postgres
                  key: password
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_HOST
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_USER
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/your-gcp-project-id/alephat/alephat-platform:latest
          imagePullPolicy: Always
          command: ["uvicorn", "alephat_platform.api.app:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: alephat-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alephat-postgres
                  key: password
            - name: SERVICE_NAME
              value: api
            - name: PLATFORM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: alephat-secrets
                  key: PLATFORM_API_TOKEN
                  optional: true
            - name: PLATFORM_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alephat-secrets
                  key: PLATFORM_JWT_SECRET
                  optional: true
            - name: GITHUB_APP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: alephat-oauth
                  key: GITHUB_APP_CLIENT_ID
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alephat-oauth
                  key: GITHUB_APP_CLIENT_SECRET
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: alephat-oauth
                  key: GITHUB_APP_ID
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: alephat-oauth
                  key: GITHUB_APP_PRIVATE_KEY
            - name: GITHUB_APP_INSTALLATION_ID
              valueFrom:
                secretKeyRef:
                  name: alephat-oauth
                  key: GITHUB_APP_INSTALLATION_ID
            - name: DASHBOARD_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: alephat-oauth
                  key: DASHBOARD_JWT_SECRET
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: alephat-oauth
                  key: TOKEN_ENCRYPTION_KEY
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: alephat-api
  namespace: alephat
spec:
  selector:
    app: alephat-api
  ports:
    - name: http
      port: 80
      targetPort: http
