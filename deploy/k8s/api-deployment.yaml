apiVersion: apps/v1
kind: Deployment
metadata:
  name: openswe-api
  namespace: openswe
  labels:
    app: openswe-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openswe-api
  template:
    metadata:
      labels:
        app: openswe-api
    spec:
      initContainers:
        - name: migrate
          image: openswe-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "openswe_platform.migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: openswe-config
                  key: DATABASE_URL
      containers:
        - name: api
          image: openswe-platform:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "openswe_platform.api.app:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: openswe-config
          env:
            - name: SERVICE_NAME
              value: api
            - name: PLATFORM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openswe-secrets
                  key: PLATFORM_API_TOKEN
                  optional: true
            - name: PLATFORM_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openswe-secrets
                  key: PLATFORM_JWT_SECRET
                  optional: true
            - name: TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: openswe-secrets
                  key: TOKEN_ENCRYPTION_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openswe-api
  namespace: openswe
spec:
  selector:
    app: openswe-api
  ports:
    - name: http
      port: 80
      targetPort: http
