apiVersion: apps/v1
kind: Deployment
metadata:
  name: alephat-webhook
  namespace: alephat
  labels:
    app: alephat-webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: alephat-webhook
  template:
    metadata:
      labels:
        app: alephat-webhook
    spec:
      initContainers:
        - name: migrate
          image: us-central1-docker.pkg.dev/your-gcp-project-id/alephat/alephat-platform:latest
          imagePullPolicy: Always
          command: ["python", "-m", "alephat_platform.migrate"]
          envFrom:
            - configMapRef:
                name: alephat-config
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_URL
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alephat-postgres
                  key: password
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_HOST
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_USER
      containers:
        - name: webhook
          image: us-central1-docker.pkg.dev/your-gcp-project-id/alephat/alephat-platform:latest
          imagePullPolicy: Always
          command: ["uvicorn", "alephat_platform.webhook.app:app", "--host", "0.0.0.0", "--port", "8081"]
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: alephat-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alephat-postgres
                  key: password
            - name: SERVICE_NAME
              value: webhook
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: alephat-secrets
                  key: GITHUB_WEBHOOK_SECRET
                  optional: true
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: alephat-secrets
                  key: SLACK_SIGNING_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alephat-webhook
  namespace: alephat
spec:
  selector:
    app: alephat-webhook
  ports:
    - name: http
      port: 80
      targetPort: http
