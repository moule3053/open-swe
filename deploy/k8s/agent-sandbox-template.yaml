apiVersion: v1
kind: Namespace
metadata:
  name: alephat-sandboxes
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: python-runtime-template
  namespace: alephat-sandboxes
spec:
  podTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: alephat-python-sandbox
    spec:
      runtimeClassName: kata-qemu
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      nodeSelector:
        cloud.google.com/gke-os-distribution: ubuntu
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: runtime
          image: us-central1-docker.pkg.dev/your-gcp-project-id/alephat/alephat-sandbox:latest
          ports:
            - name: toolbox
              containerPort: 8888
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
