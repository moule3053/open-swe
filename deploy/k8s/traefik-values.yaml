deployment:
  replicas: 1
  initContainers:
    - name: volume-permissions
      image: busybox:1.36.1
      command: ["sh", "-c", "touch /data/acme.json && chmod 600 /data/acme.json"]
      volumeMounts:
        - name: data
          mountPath: /data

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

service:
  annotations:
    cloud.google.com/network-tier: Premium
  spec:
    type: LoadBalancer

ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    http:
      tls:
        enabled: true

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  path: /data

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /data/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

accessLog:
  enabled: true
