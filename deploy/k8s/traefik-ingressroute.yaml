apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: openswe
  namespace: alephat
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`openswe.example.com`) && PathPrefix(`/hooks/`)
      priority: 100
      services:
        - name: openswe-webhook
          port: 80
    - kind: Rule
      match: Host(`openswe.example.com`)
      priority: 10
      services:
        - name: openswe-ui
          port: 80
  tls:
    certResolver: letsencrypt
