apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openswe-postgresql
spec:
  serviceName: openswe-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: openswe-postgresql
  template:
    metadata:
      labels:
        app: openswe-postgresql
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: openswe
            - name: POSTGRES_USER
              value: openswe
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openswe-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U openswe -d openswe"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openswe-postgresql
spec:
  selector:
    app: openswe-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
