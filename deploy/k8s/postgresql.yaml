apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alephat-postgresql-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alephat-postgresql
spec:
  serviceName: alephat-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: alephat-postgresql
  template:
    metadata:
      labels:
        app: alephat-postgresql
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: alephat
            - name: POSTGRES_USER
              value: alephat
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alephat-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U alephat -d alephat"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: alephat-postgresql-data
---
apiVersion: v1
kind: Service
metadata:
  name: alephat-postgresql
spec:
  selector:
    app: alephat-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
