apiVersion: batch/v1
kind: Job
metadata:
  name: alephat-migrate
  namespace: alephat
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: alephat-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: us-central1-docker.pkg.dev/your-gcp-project-id/alephat/alephat-platform:latest
          imagePullPolicy: Always
          command: ["python", "-m", "alephat_platform.migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_URL
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alephat-postgres
                  key: password
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_HOST
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_NAME
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: alephat-config
                  key: DATABASE_USER
