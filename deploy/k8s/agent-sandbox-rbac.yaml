apiVersion: v1
kind: ServiceAccount
metadata:
  name: openswe-harness
  namespace: alephat
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openswe-agent-sandbox
  namespace: alephat-sandboxes
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims", "sandboxtemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openswe-harness-agent-sandbox
  namespace: alephat-sandboxes
subjects:
  - kind: ServiceAccount
    name: openswe-harness
    namespace: alephat
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openswe-agent-sandbox
