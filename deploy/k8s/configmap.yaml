apiVersion: v1
kind: ConfigMap
metadata:
  name: openswe-config
  namespace: openswe
data:
  DATABASE_URL: ""
  DATABASE_HOST: "openswe-postgresql"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "openswe"
  DATABASE_USER: "openswe"
  NATS_URL: "nats://nats:4222"
  LLM_MODE: "litellm"
  LITELLM_ENABLED: "true"
  LITELLM_BASE_URL: "http://alephat-platform-litellm:4000"
  LITELLM_API_KEY: "sk-litellm"
  DEFAULT_MODEL: "gemini-5.6-flash"
  DEFAULT_SANDBOX_PROVIDER: "agent_sandbox"
  AGENT_SANDBOX_NAMESPACE: "alephat-sandboxes"
  AGENT_SANDBOX_TEMPLATE: "python-runtime-template"
  API_AUTH_DISABLED: "false"
  WEBHOOK_SIGNATURES_REQUIRED: "true"
  DASHBOARD_BASE_URL: "http://127.0.0.1:18080"
  DASHBOARD_API_BASE_URL: "http://127.0.0.1:18080"
  DASHBOARD_ALLOWED_ORIGINS: "http://127.0.0.1:18080"
  CORS_ORIGINS: "http://127.0.0.1:18080"
  LEASE_TTL_SECONDS: "60"
  HEARTBEAT_INTERVAL_SECONDS: "15"
  MAX_RUN_RETRIES: "3"
  ALLOW_STUB_SANDBOXES: "false"
