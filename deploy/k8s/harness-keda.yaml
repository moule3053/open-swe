# Requires KEDA + optional NATS scaler.
# Scales harness Deployment so each pod runs at most one task (worker concurrency=1).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: alephat-harness
  namespace: alephat
spec:
  scaleTargetRef:
    name: alephat-harness
  minReplicaCount: 0
  maxReplicaCount: 50
  cooldownPeriod: 120
  pollingInterval: 15
  triggers:
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: nats.alephat.svc:8222
        account: "$G"
        stream: TASKS
        consumer: harness-workers
        lagThreshold: "1"
        activationLagThreshold: "0"
        useHttps: "false"
