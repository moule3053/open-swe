apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alephat-harness-to-agent-sandbox
  namespace: alephat-sandboxes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alephat-python-sandbox
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alephat
          podSelector:
            matchLabels:
              app: alephat-harness
      ports:
        - protocol: TCP
          port: 8888
